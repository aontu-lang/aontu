# THE STANDARD RUN: what a pull request waits for, about three minutes
# on Linux and never more than five (ADR-070, ADR-071). Three jobs, side by side:
#
#   happy    both ports build; the committed TypeScript build and every
#            generated copy are what the sources say; the comment gate;
#            the gate group of the TypeScript suite (ts/test/groups.tsv,
#            group 0: the word cap, the version literals, the inlined
#            copies, the groups themselves).
#   go       the Go suite, whole. One port runs every shared-spec row on
#            every push, and Go is the one that does it in two minutes.
#   sample   ONE group of the TypeScript suite, chosen by the run number
#            (ts/scripts/test-group.cjs), so consecutive runs walk every
#            group and a pull request's push and pull_request runs
#            sample two different ones. `workflow_dispatch` takes a
#            group, or "all".
#
# Everything else -- the three operating systems, the TypeScript suite
# whole, the coverage gate, the use cases, the system, the prose gate --
# is daily.yml, nightly on main and on every push to release, and so is
# the definition (spec/, spec.yml). What the sample does not
# catch, the daily does, the next morning: that is the trade.
#
# Both triggers, as before: this repository's pull_request events do not
# fire reliably on a synchronize (docs.yml's history), so push runs too.
# A push supersedes the running build of the same branch; main and
# release are never cancelled.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      group:
        description: 'TypeScript test group to run: a number from ts/test/groups.tsv, or "all"'
        type: string
        default: ''

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release' }}

jobs:
  happy:
    name: Happy path
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: ts/package.json
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - run: npm install
        working-directory: ts

      # BUILD, THEN REQUIRE A CLEAN TREE. `make build-ts` regenerates
      # every inlined copy (the signature declaration, the teaching
      # pack, the built-in models, the format grammars, the
      # vocabularies, the meta-schemas), rebuilds ts/dist and
      # ts/dist-test and draws the figures, and all of it is committed:
      # a tree that changes under it was carrying a copy its sources no
      # longer say. This is the coverage job's "committed build is up
      # to date" check, widened to every generated file and run where
      # every pull request sees it, in a minute.
      - run: make build-ts
      - name: The committed build and generated copies are current
        run: |
          if ! git diff --quiet; then
            echo "the tree changed under 'make build-ts' -- run it and commit:"
            git diff --stat
            exit 1
          fi

      - run: make comments
      - run: go build ./... && go vet ./...
        working-directory: go

      # The gate group, and that the groups cover the suite: a test
      # file in no group is never sampled, and only this says so.
      - run: node scripts/test-group.cjs --check
        working-directory: ts
      - run: node scripts/test-group.cjs --run 0
        working-directory: ts

  go:
    name: Go
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  sample:
    name: Sample (one TypeScript group)
    # `npm install` resolves the tree on every run (package-lock.json is
    # not committed) and has taken minutes on a slow registry hour; a
    # sample that passes the budget fails, and a rerun draws again.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: ts/package.json
      - run: npm install
      - run: npm run build
      - name: One group, by the run number
        env:
          AONTU_TEST_GROUP: ${{ inputs.group }}
        run: |
          G="$(node scripts/test-group.cjs --pick)"
          echo "sampled TypeScript group $G of $(node scripts/test-group.cjs --list | grep -c '^group ')" >> "$GITHUB_STEP_SUMMARY"
          node scripts/test-group.cjs --run "$G"
