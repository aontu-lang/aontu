# Dual-language build: a TypeScript matrix and a Go job.

name: build

on: ['push', 'pull_request']

jobs:
  build-ts:
    name: TypeScript
    # Twelve, not six: `npm install` resolves the tree on every run
    # (package-lock.json is not committed) and has taken three to five
    # minutes on a slow registry hour, which left the six-minute budget
    # no room for the tests they were still passing. The npm cache
    # below keeps the downloads across runs; the budget keeps a slow
    # hour from reading as a failure.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24.x, latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ts/package.json
      - run: npm install
      - run: npm run build
      - run: npm test

  build-go:
    name: Go
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.24', 'stable']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # ADR-002 requires 100% coverage in BOTH ports, and until now that
  # floor was enforced only on a contributor's machine: CI ran the
  # suites but never the gate, so a drop reached main unremarked. One
  # job, on ubuntu -- the gate is a property of the code, not of the
  # platform the suites already cover above.
  coverage:
    name: Coverage gate (ADR-002)
    # THIRTY, NOT FIFTEEN. `make cov` runs cov-ts and cov-go side by
    # side, and cov-ts is test/covrun.js, which runs the TypeScript
    # suite under coverage up to three times (V8's merge drops
    # observations about one run in six, so the driver retries). A pass
    # is about five minutes on the hosted runner. Fifteen minutes held
    # the first pass and cancelled a job that had reached 100% on its
    # retry (#160 on main, and #162 twice); the Makefile has since shed
    # the separate table pass, and this budget holds the third pass the
    # driver is written to make, with margin.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: npm install
        working-directory: ts
      # BUILD BEFORE MEASURING. `make cov` runs the COMMITTED
      # dist-test/**, so a job that does not build measures whatever
      # compiled artifacts the branch happens to carry -- and a change
      # to ts/src that forgot to rebuild would be graded against the old
      # code and keep its old 100%. The build matrix above builds
      # because it must run the suite; this job has to say so itself.
      - run: npm run build
        working-directory: ts
      # AND THE COMMITTED BUILD MUST BE THE BUILD. ts/dist and
      # ts/dist-test are checked in (AGENTS.md), so if the step above
      # changed anything, the tree's artifacts were stale: the suites
      # everywhere else in CI just tested code that is not what this
      # branch ships. Fail loudly rather than measure the right thing
      # while the repository holds the wrong one.
      #
      # Nothing is excluded from the comparison: tsc's incremental
      # cache used to land in ts/dist and had to be, because its bytes
      # record how the build was reached rather than what it produced
      # -- a clean build and an incremental one emit identical .js,
      # .d.ts and .map and different buildinfo. tsBuildInfoFile now
      # writes it to ts/.tsbuild/, which is ignored, so ts/dist holds
      # only what ships.
      - name: Committed build is up to date
        run: |
          if ! git diff --quiet -- ts/dist ts/dist-test; then
            echo "ts/dist or ts/dist-test is stale -- run 'make build-ts' and commit:"
            git diff --stat -- ts/dist ts/dist-test
            exit 1
          fi
      - run: make cov

  # THE USE CASES ARE A GATE NOW, AND THIS IS WHY.
  #
  # `use-cases/run-all.sh` drives the real CLI end to end over sixteen
  # worked models -- the only check here that exercises the engine the
  # way a user does, through files, includes, data merges and exit
  # codes, rather than through a spec row. It is therefore the only one
  # that can notice a removed language feature still being used by a
  # model.
  #
  # It ran on contributors' machines and nowhere else, and the cost
  # arrived: ADR-014 (#102) removed id() with every suite green and
  # every gate passing, and left four use cases broken on main -- 01,
  # 05, 10 and 12. Nothing in CI evaluated a model that used the feature
  # it removed, so the corpus stayed red across four merges until #107
  # and #109 repaired it. The engine was right; the corpus was never
  # asked.
  #
  # One job, on ubuntu: like the coverage gate, this is a property of
  # the code rather than of the platform the matrix above covers.
  # python3 is preinstalled and is what the JSON and SQLite assertions
  # use (sqlite3 through the stdlib module, not the CLI).
  use-cases:
    name: Use cases
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm install
        working-directory: ts
      # The checks run ts/bin/aontu.js, which loads the COMMITTED
      # ts/dist. Build first for the same reason the coverage gate does:
      # an unbuilt tree would grade this branch's models against the
      # previous branch's engine. Whether the committed build is itself
      # current is the coverage gate's assertion, not this job's -- one
      # check, one owner.
      - run: npm run build
        working-directory: ts

      # THE BYTE GATE NEEDS A GENERATOR RUNTIME, and without one it does
      # not fail -- it SKIPS. `tools/cmptree-check.js` exits 3 when none
      # is installed and each `check.sh` records a skip, so drift in a
      # committed generated file left this job green: 15-code-generation
      # alone reported ten checks with five skipped where it reports
      # eleven with none.
      #
      # Installed OUTSIDE the checkout and reached through the seam's own
      # `JOSTRACA_PATH`, so neither `ts/package.json` nor `go/go.mod`
      # gains a dependency in either direction. That is the property the
      # pipe exists to keep, and a CI job is where it can be held without
      # spending it.
      #
      # PINNED, for the reason the prose gate pins Vale: an unpinned
      # runtime turns someone else's release into a red build on a pull
      # request that touched one word.
      - name: Install the generator runtime
        run: |
          npm install --no-save --no-package-lock \
            --prefix "$RUNNER_TEMP/generator" jostraca@0.38.0
          echo "JOSTRACA_PATH=$RUNNER_TEMP/generator/node_modules/jostraca" \
            >> "$GITHUB_ENV"

      # A SKIP IS NOT A PASS. If the install above half-succeeds the seam
      # exits 3, every byte gate skips and this job stays green -- the
      # exact failure the step above is here to end. Fail loudly instead.
      - name: The generator runtime resolves
        run: |
          node -e 'require(process.env.JOSTRACA_PATH)' || {
            echo "::error::no generator runtime: every byte gate would skip"
            exit 1
          }
          node -e 'console.log("jostraca " +
            require(process.env.JOSTRACA_PATH + "/package.json").version)'

      - run: ./run-all.sh
        working-directory: use-cases
