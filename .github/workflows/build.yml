# Dual-language build: a TypeScript matrix and a Go job.

name: build

on: ['push', 'pull_request']

jobs:
  build-ts:
    name: TypeScript
    # Twelve, not six: `npm install` resolves the tree on every run
    # (package-lock.json is not committed) and has taken three to five
    # minutes on a slow registry hour, which left the six-minute budget
    # no room for the tests they were still passing. The npm cache
    # below keeps the downloads across runs; the budget keeps a slow
    # hour from reading as a failure.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24.x, latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ts/package.json
      - run: npm install
      - run: npm run build
      - run: npm test

  build-go:
    name: Go
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.24', 'stable']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # ADR-002 requires 100% coverage in BOTH ports, and until now that
  # floor was enforced only on a contributor's machine: CI ran the
  # suites but never the gate, so a drop reached main unremarked. One
  # job, on ubuntu -- the gate is a property of the code, not of the
  # platform the suites already cover above.
  coverage:
    name: Coverage gate (ADR-002)
    # THIRTY, NOT FIFTEEN. `make cov` runs cov-ts and cov-go side by
    # side, and cov-ts is test/covrun.js, which runs the TypeScript
    # suite under coverage up to three times (V8's merge drops
    # observations about one run in six, so the driver retries). A pass
    # is about five minutes on the hosted runner. Fifteen minutes held
    # the first pass and cancelled a job that had reached 100% on its
    # retry (#160 on main, and #162 twice); the Makefile has since shed
    # the separate table pass, and this budget holds the third pass the
    # driver is written to make, with margin.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: npm install
        working-directory: ts
      # BUILD BEFORE MEASURING. `make cov` runs the COMMITTED
      # dist-test/**, so a job that does not build measures whatever
      # compiled artifacts the branch happens to carry -- and a change
      # to ts/src that forgot to rebuild would be graded against the old
      # code and keep its old 100%. The build matrix above builds
      # because it must run the suite; this job has to say so itself.
      - run: npm run build
        working-directory: ts
      # AND THE COMMITTED BUILD MUST BE THE BUILD. ts/dist and
      # ts/dist-test are checked in (AGENTS.md), so if the step above
      # changed anything, the tree's artifacts were stale: the suites
      # everywhere else in CI just tested code that is not what this
      # branch ships. Fail loudly rather than measure the right thing
      # while the repository holds the wrong one.
      #
      # tsconfig.tsbuildinfo is EXCLUDED, and only it. That file is
      # tsc's incremental cache, and its bytes record how the build was
      # reached rather than what it produced -- a clean build and an
      # incremental one emit identical .js, .d.ts and .map (322 files,
      # checked) and different buildinfo. Comparing it would fail this
      # job for the shape of the runner's cache, which is not a fact
      # about the branch.
      - name: Committed build is up to date
        run: |
          if ! git diff --quiet -- ts/dist ts/dist-test \
              ':(exclude)ts/dist/tsconfig.tsbuildinfo' \
              ':(exclude)ts/dist-test/tsconfig.tsbuildinfo'; then
            echo "ts/dist or ts/dist-test is stale -- run 'make build-ts' and commit:"
            git diff --stat -- ts/dist ts/dist-test \
              ':(exclude)ts/dist/tsconfig.tsbuildinfo' \
              ':(exclude)ts/dist-test/tsconfig.tsbuildinfo'
            exit 1
          fi
      - run: make cov

  # THE USE CASES ARE A GATE NOW, AND THIS IS WHY.
  #
  # `use-cases/run-all.sh` drives the real CLI end to end over sixteen
  # worked models -- the only check here that exercises the engine the
  # way a user does, through files, includes, data merges and exit
  # codes, rather than through a spec row. It is therefore the only one
  # that can notice a removed language feature still being used by a
  # model.
  #
  # It ran on contributors' machines and nowhere else, and the cost
  # arrived: ADR-014 (#102) removed id() with every suite green and
  # every gate passing, and left four use cases broken on main -- 01,
  # 05, 10 and 12. Nothing in CI evaluated a model that used the feature
  # it removed, so the corpus stayed red across four merges until #107
  # and #109 repaired it. The engine was right; the corpus was never
  # asked.
  #
  # One job, on ubuntu: like the coverage gate, this is a property of
  # the code rather than of the platform the matrix above covers.
  # python3 is preinstalled and is what the JSON and SQLite assertions
  # use (sqlite3 through the stdlib module, not the CLI).
  use-cases:
    name: Use cases
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm install
        working-directory: ts
      # The checks run ts/bin/aontu.js, which loads the COMMITTED
      # ts/dist. Build first for the same reason the coverage gate does:
      # an unbuilt tree would grade this branch's models against the
      # previous branch's engine. Whether the committed build is itself
      # current is the coverage gate's assertion, not this job's -- one
      # check, one owner.
      - run: npm run build
        working-directory: ts

      - run: ./run-all.sh
        working-directory: use-cases

  # THE SYSTEM THAT BOOTS.
  #
  # `use-cases/run-all.sh` above already reaches test/system/rb-solar,
  # and on a runner with no Ruby bundle it runs the six checks that do
  # not need one: the generators parse and round-trip, the tree they
  # must reproduce byte for byte, the pinned diagrams, the agreed form
  # and this patch. The three it skips are the ones that make the system
  # a system -- the app boots and the reference's own twenty validation
  # tests pass against it over HTTP, its Ruby SDK drives it, and the
  # human pages answer.
  #
  # Those need Ruby, a bundle and the reference checkout, which is a
  # different shape of job from the use-case one and would slow it for
  # every model it drives. Hence a job of its own; check.sh is the same
  # script either way and reports which legs it ran.
  system-rb-solar:
    name: System (rb-solar)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NODE 24 IS NOT INCIDENTAL. The reference's validate.ts is
      # TypeScript run by node directly; type stripping arrives in
      # 22.18, and check.sh skips that leg with the version in the note
      # on anything older rather than dying in the parser.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: test/system/rb-solar/app

      # The engine the check drives: $AONTU defaults to ts/bin/aontu.js,
      # which loads the committed ts/dist. Build for the same reason the
      # use-case job does -- an unbuilt tree grades this branch's model
      # against the previous branch's engine.
      - run: npm install
        working-directory: ts
      - run: npm run build
        working-directory: ts

      # The reference repository, for the SDK leg only. Public, shallow,
      # and read once: ref/ already carries the OpenAPI description, the
      # validation script and the seed data at a pinned commit. Without
      # this clone that one leg skips with a note and the other nine
      # still run.
      # AT THE REVISION ref/ WAS VENDORED FROM, which
      # test/system/rb-solar/ref/README.md records. `--depth 1` shallows
      # a clone; it does not pin one, so a plain clone follows the
      # remote's HEAD and this leg would silently start testing the app
      # against a contract the repository never vendored -- going red,
      # or worse green, with no change here. Fetching the SHA keeps the
      # SDK and the vendored openapi.yaml, validate.ts and seed data one
      # consistent reference.
      - name: Fetch the reference SDK
        env:
          SDK_REF: 5b8eae968637ebe507c915fe804131d60ef16e15
        run: |
          git init -q "$RUNNER_TEMP/solardemo"
          git -C "$RUNNER_TEMP/solardemo" remote add origin \
            https://github.com/voxgig-sdk/voxgig-solardemo-sdk.git
          git -C "$RUNNER_TEMP/solardemo" fetch --depth 1 origin "$SDK_REF"
          git -C "$RUNNER_TEMP/solardemo" checkout -q FETCH_HEAD

      - name: rb-solar
        working-directory: test/system/rb-solar
        env:
          RB_SOLAR_SDK: ${{ runner.temp }}/solardemo/rb
        run: ./check.sh
