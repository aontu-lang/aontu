# Prose gate. Runs over the reader-facing pages in CI; see
# .github/workflows/docs.yml and docs/STYLE-GUIDE.md.
#
# Precedence, decided deliberately and recorded in the style guide:
#
#   house voice  ->  Google  ->  Vale defaults
#
# Google (developers.google.com/style) is the base for everything the
# house guide is silent on. Where the two collide the house voice wins,
# and every such override is listed below with its reason, so a reader
# who wonders why a Google rule is off finds the answer here rather than
# guessing it is an oversight.
#
# Every count in this file is what Vale reports on a clean run over the
# gated set: 4732 alerts across 88 files. A rule demoted without that
# number reads later as an oversight and gets re-promoted by somebody
# repeating the work, and a number nothing re-measures goes stale the
# first time a page is edited: these were taken once and were out by a
# factor of two when they were next checked.
# `node ts/scripts/vale-counts.cjs` checks every one of them against a
# live run, `--write` re-measures, and the docs workflow fails on drift.
# A SUB-COUNT inside a note, saying how many of a rule's hits are one
# word, is not one of those: the script does not read them. Each is
# counted by message text over the same file list at the level above,
# and re-counted by hand when the rule's own number moves.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Aontu
# PINNED BY URL, not by name. `Packages = Google` resolves to whatever
# the package registry serves at sync time, so a Google release could
# add or change an error-level rule and turn an unrelated docs pull
# request red -- exactly the nondeterminism pinning the BINARY was
# supposed to prevent. Pinning one without the other prevents half of
# it.
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip

[*.md]
BasedOnStyles = Vale, Google, Aontu

# --- Scope ------------------------------------------------------------
#
# Vale is handed an EXPLICIT FILE LIST, printed by
# `ts/scripts/gated-docs.cjs` and shared with ts/test/docs.test.ts, so
# the two gates cannot disagree about which pages they cover.
#
# It is not done with `[section]` headers here, and that is not a style
# preference: Vale selects sections by file EXTENSION, so a header like
# `[docs/design/**]` matches nothing and the working documents get
# linted anyway, in silence. Nor with `--glob`, which takes one pattern
# and would have to encode six exclusions in it.

# --- Overrides where the house voice wins ------------------------------
#
# The register is Richard Rodger's blog voice, not neutral vendor docs.
# These rules encode Google's house style rather than correctness, and
# each would flatten a voice choice the guide makes on purpose.

# "We" is allowed in TUTORIALS ONLY, where the page walks through code
# with the reader (STYLE-GUIDE.md, voice rule 7). Vale cannot express
# "only in tutorials", so the rule is off here and the restriction is
# carried by docs.test.ts `we-appears-only-in-tutorials`, which knows
# which page is which.
Google.We = NO

# "I" appears nowhere in the docs by house rule, which is STRICTER than
# Google's. docs.test.ts `first-person-singular-appears-nowhere` covers
# it, including `my` and `mine`, and does not fire on the `I` inside
# quoted CLI output the way this rule does.
#
# Switching a Google rule off in favour of a house rule means the house
# rule has to be real: the named test is the receipt.
Google.FirstPerson = NO

# British spellings (-ise, -isation, colour). Google style is US
# English; the house voice is not, and the precedence above puts the
# house voice first. 13 hits, every one of them deliberate. Actual
# misspellings are caught by Vale.Spelling, which stays at error.
Google.Spelling = NO

# The house voice alternates long explanatory sentences with short
# verdicts, and the occasional passive is how a sentence keeps its
# subject on the thing being documented ("the file is overwritten").
# 1600 hits, almost all of them fine. Advisory only, never a gate.
Google.Passive = suggestion

# Contractions are a register choice per document kind, not a rule:
# tutorials contract, reference pages do not. 1271 hits, none of them
# defects. Advisory only.
Google.Contractions = suggestion

# Voice rule 4 rations parentheses more precisely than "use parentheses
# judiciously" can: definitions, caveats, and at most one dry aside per
# page, with reference pages carrying facts only. 704 hits.
Google.Parens = suggestion

# A semicolon joining two independent clauses is part of the long
# explanatory sentence in voice rule 6. 427 hits. Advisory.
Google.Semicolons = suggestion

# --- The gate ----------------------------------------------------------
#
# Error level, and these fail CI. They are conventions a reader benefits
# from and an author has no reason to vary.

Google.Latin = error
Google.Ellipses = error
Aontu.WordChoice = error

# Vale's dictionary, plus .vale/styles/config/vocabularies/Aontu. 217
# domain terms are accepted there by name; a 218th is a typo until
# somebody adds it, which is the point of keeping this at error.
Vale.Spelling = error

# The banned list, read from reject.txt in the same vocabulary
# directory. ts/test/docs.test.ts reads that identical file, so the two
# gates cannot disagree about what is banned.
Vale.Avoid = error

# The house guide bans em dashes. The documentation test checks prose
# after stripping code and quoted output; Google's spacing rule is redundant.
Google.EmDash = NO

# Serial commas, which the guide requires. 43 hits, and the rule is
# right about half the time here: some are two-item lists sitting after
# a comma clause ("each with the line and column it came from"), which
# it cannot tell from a list, and the rest are real. Kept as a warning
# an author reads, not a gate: a rule wrong that often cannot fail a
# build, and an author reading its output can tell the two apart in the
# page in front of them.
Google.OxfordComma = warning

# The guide allows one exclamation mark per page, in tutorials only, on a
# genuine payoff; Google bans them outright. 1 hit, and it is the one
# `tutorial-graph.md` is entitled to. The ration is carried by
# docs.test.ts, which knows which page is a tutorial.
Google.Exclamation = warning

# --- Demoted on evidence, not on taste --------------------------------
#
# Each of these was tried at error level against the real pages first.
# They are warnings because they were WRONG here, not because they were
# inconvenient; the count is what each produced on a clean run.

# "Avoid the unverifiable claim 'guarantee'." Every one of the 20 hits
# is order theory: "the lattice guarantee", "where each guarantee is
# conditional". The rule assumes a marketing register, and this is a
# page about what the algebra promises. A gate that fires on the subject
# matter is a gate people learn to switch off.
Google.ExcessiveClaims = warning

# Flags "sees" and "tells" as attributing human qualities to software.
# 21 hits, 14 on `sees` and 7 on `tells`, and many are about PEOPLE --
# "the text a human sees", "a consumer never sees `@2`", "tells the
# reader what it left behind" -- which the rule cannot tell apart from
# "a spread template sees".
Google.Anthropomorphism = warning

# Maps `touch` to `tap`, a mobile-UI rule, and `above`/`below` to
# `preceding`/`following`. 180 hits, of which 105 are `above` as an
# ordinary cross-reference across the reference pages and 14 are
# `regex`; `below` produces none. The rest are `application`, `kill`,
# `file path`, `touch`, `stylesheet` and four single substitutions
# Google makes for a general audience. The
# one that does hold is carried at error level by Aontu.WordChoice.
Google.WordListCase = warning

# "Use 'command-line tool' instead of 'CLI'." 72 hits. The audience runs
# the command-line tool and calls it a CLI; the reference documents a
# `--cli` surface. Spelling it out would serve nobody.
Google.WordList = warning

# Wants CUE, JSON, LSP, RE2, SGR and TSV spelled out. 275 hits, all
# standard terms for a reader who is comparing configuration languages.
Google.Acronyms = warning

# Fires on a colon followed by a proper noun -- "'TypeScript' should be
# in lowercase", "'Aontu' should be in lowercase". 15 hits, 15 false:
# ten are a proper noun or an acronym, and five are the first word of a
# link's text.
Google.Colons = warning

# Sentence case in headings, which the guide requires. It cannot know
# that Aontu, Go and TypeScript are proper nouns. 22 hits.
Google.Headings = warning

# US convention: commas and periods INSIDE the quotation marks. The
# house voice is not US English -- the same call as the -ise spellings
# -- and putting a period inside a quoted `code span` is actively wrong
# when the quote is a literal. 32 hits.
Google.Quotes = warning

# Flags an `-ly` adverb before a hyphen ("newly-created"), a real error
# class -- but it cannot tell an adverb from a word that merely ends in
# those two letters. It was right about six of its seven hits here, and
# they were fixed rather than excused. 1 hit, 1 false: `early-folding`,
# where `early` is an adjective.
Google.LyHyphens = warning

# "Put a nonbreaking space between the number and the unit in '065s'."
# 3 hits, 3 false: two inside a quoted duration and one on the `0d`
# prefix that marks an exact number.
Google.Units = warning

# "Avoid using 'will'." 37 hits, each on a consequence that follows
# later: what a subsequent call does with what this one returned, what
# an editor does when the server answers, and what the engine does not
# promise.
Google.Will = warning
Google.Timeless = warning
